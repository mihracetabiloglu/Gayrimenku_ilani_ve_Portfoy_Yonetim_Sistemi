<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmlakPrime | İlan Ver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1F3A;--navy-mid:#163258;--navy-light:#1E4480;
  --accent:#C9A84C;--accent-light:#E8C97A;
  --white:#ffffff;--gray-50:#F8F9FB;--gray-100:#EFF1F5;
  --gray-200:#DDE1EA;--gray-400:#9AA3B2;--gray-600:#5A6478;
  --gray-800:#2C3447;--input:#f5f7fb;--text:#111827;
}
body{font-family:'DM Sans',sans-serif;background:var(--gray-50);color:var(--text);min-height:100vh}

/* NAV */
.navbar{background:var(--navy);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;box-shadow:0 2px 12px rgba(0,0,0,0.2)}
.nav-brand{font-family:'Playfair Display',serif;color:var(--white);font-size:1.3rem;font-weight:700;text-decoration:none}
.nav-brand span{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:1rem}
.nav-link{color:rgba(255,255,255,0.75);text-decoration:none;font-size:.9rem;transition:color .2s}
.nav-link:hover{color:var(--accent)}
.btn-nav{padding:.5rem 1.25rem;border-radius:999px;background:var(--accent);color:#07101f;font-weight:700;font-size:.85rem;border:none;cursor:pointer;text-decoration:none;transition:filter .2s}
.btn-nav:hover{filter:brightness(1.1)}

/* LAYOUT */
.page-wrap{max-width:820px;margin:2.5rem auto;padding:0 1rem 3rem}
.page-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--navy);margin-bottom:.25rem}
.page-sub{color:var(--gray-600);font-size:.9rem;margin-bottom:2rem}

/* CARD */
.form-card{background:#fff;border-radius:20px;padding:2rem;box-shadow:0 4px 24px rgba(11,31,58,0.07);margin-bottom:1.5rem}
.card-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid var(--gray-100)}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-grid.single{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:.4rem}
.field label{font-size:.82rem;font-weight:600;color:var(--gray-600);letter-spacing:.3px}
.field input,.field select,.field textarea{
  background:var(--input);border:1.5px solid rgba(11,31,58,0.08);
  border-radius:12px;padding:11px 14px;
  font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--text);
  transition:border-color .2s,box-shadow .2s;outline:none;width:100%
}
.field textarea{resize:vertical;min-height:100px}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:rgba(201,168,76,0.8);
  box-shadow:0 0 0 3px rgba(201,168,76,0.14);
  background:#fff
}
.field input::placeholder,.field textarea::placeholder{color:#8993a5}

/* IMAGE UPLOAD */
.upload-zone{
  border:2px dashed var(--gray-200);border-radius:14px;
  padding:2rem;text-align:center;cursor:pointer;
  transition:border-color .2s,background .2s;
  background:var(--gray-50)
}
.upload-zone:hover{border-color:var(--accent);background:rgba(201,168,76,0.04)}
.upload-zone.drag{border-color:var(--accent);background:rgba(201,168,76,0.08)}
.upload-icon{font-size:2rem;margin-bottom:.5rem;color:var(--accent)}
.upload-text{font-size:.9rem;color:var(--gray-600)}
.upload-text span{color:var(--accent);font-weight:600}
#fileInput{display:none}

.preview-grid{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1rem}
.preview-item{position:relative;width:90px;height:90px}
.preview-item img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.preview-item .remove{
  position:absolute;top:-6px;right:-6px;
  width:20px;height:20px;border-radius:50%;
  background:#E24B4A;color:#fff;border:none;
  font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center
}

/* BUTTON */
.btn-submit{
  width:100%;padding:14px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent-light),var(--accent));
  color:#07101f;border:none;font-family:'DM Sans',sans-serif;
  font-size:1rem;font-weight:800;letter-spacing:.5px;cursor:pointer;
  transition:filter .2s,transform .1s;box-shadow:0 8px 24px rgba(201,168,76,0.28)
}
.btn-submit:hover{filter:brightness(1.06)}
.btn-submit:active{transform:scale(0.98)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;filter:none}

/* TOAST */
.toast{
  position:fixed;bottom:2rem;right:2rem;z-index:2000;
  background:var(--navy);color:#fff;padding:.8rem 1.4rem;
  border-radius:14px;font-size:.88rem;font-weight:500;
  box-shadow:0 12px 40px rgba(11,31,58,0.25);
  transform:translateY(80px);opacity:0;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;border-left:4px solid var(--accent);max-width:320px
}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left-color:#27ae60}
.toast.error{border-left-color:#E24B4A}

@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}
  .page-wrap{padding:0 .75rem 2rem}
  .form-card{padding:1.25rem}
}
</style>
<script src="auth-session.js"></script>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-brand">Emlak<span>Prime</span></a>
  <div class="nav-right">
    <a href="hesabim.html" class="nav-link">Hesabım</a>
    <a href="index.html" class="btn-nav">← Ana Sayfa</a>
  </div>
</nav>

<div class="toast" id="toast"></div>

<div class="page-wrap">
  <div class="page-title">İlan Ver</div>
  <div class="page-sub">Gayrimenkulünüzü binlerce kullanıcıya ulaştırın.</div>

  <!-- Temel Bilgiler -->
  <div class="form-card">
    <div class="card-title">Temel Bilgiler</div>
    <div class="form-grid single" style="margin-bottom:1rem">
      <div class="field">
        <label>İlan Başlığı *</label>
        <input type="text" id="title" placeholder="Örn: Kadıköy'de 3+1 Satılık Daire">
      </div>
    </div>
    <div class="form-grid" style="margin-bottom:1rem">
      <div class="field">
        <label>Fiyat (₺) *</label>
        <input type="number" id="price" placeholder="0">
      </div>
      <div class="field">
        <label>İlan Tipi *</label>
        <select id="propertyType"><option value="">Seçiniz...</option></select>
      </div>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>Kategori *</label>
        <select id="category"><option value="">Seçiniz...</option></select>
      </div>
      <div class="field">
        <label>Şehir *</label>
        <select id="city" onchange="loadDistricts(this.value)"><option value="">Seçiniz...</option></select>
      </div>
    </div>
    <div class="form-grid" style="margin-top:1rem">
      <div class="field">
        <label>İlçe</label>
        <select id="district" onchange="loadNeighborhoods(this.value)"><option value="">Önce şehir seçin</option></select>
      </div>
      <div class="field">
        <label>Mahalle</label>
        <select id="neighborhood"><option value="">Önce ilçe seçin</option></select>
      </div>
    </div>
    <div class="form-grid" style="margin-top:1rem">
      <div class="field">
        <label>Kat *</label>
        <input type="number" id="floor" min="-2" step="1" required placeholder="Örn: -1, 0, 3">
      </div>
    </div>
  </div>

  <!-- Açıklama -->
  <div class="form-card">
    <div class="card-title">Açıklama</div>
    <div class="field">
      <label>İlan Açıklaması</label>
      <textarea id="description" placeholder="Gayrimenkul hakkında detaylı bilgi yazın..."></textarea>
    </div>
  </div>

  <!-- Fotoğraflar -->
  <div class="form-card">
    <div class="card-title">Fotoğraflar</div>
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon"><i class="fa-regular fa-images"></i></div>
      <div class="upload-text">Fotoğraf eklemek için tıklayın veya <span>sürükleyip bırakın</span></div>
      <div class="upload-text" style="font-size:.78rem;margin-top:.3rem;color:var(--gray-400)">PNG, JPG — max 10 MB</div>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this.files)">
    <div class="preview-grid" id="previewGrid"></div>
  </div>

  <button class="btn-submit" id="submitBtn" onclick="submitIlan()">İlanı Yayınla</button>
</div>

<script>
const token = window.EmlakAuth?.getToken?.() || localStorage.getItem('token') || sessionStorage.getItem('token') || localStorage.getItem('emlakprime_token') || sessionStorage.getItem('emlakprime_token') || '';
const user  = window.EmlakAuth?.getUser?.() || (() => { try { return JSON.parse(localStorage.getItem('emlakprime_user') || sessionStorage.getItem('emlakprime_user')); } catch(e) { return null; } })();

// Giriş ve yetki kontrolü
if (!window.EmlakAuth?.validateSession({ redirect: false }) || !user || !token) { window.location.href = 'login.html?redirect=ilan-ekle.html'; }
const isAgent = (user?.roles||[]).some(r => r.includes('AGENT') || r.includes('ADMIN'));
if (!isAgent) { alert('Bu sayfaya erişim için Agent veya Admin yetkisi gereklidir.'); window.location.href = 'index.html'; }

const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

// Dropdown verileri
async function loadSelects() {
  const [types, cats, cities] = await Promise.all([
    fetch('/api/property-types').then(r => r.json()).catch(() => []),
    fetch('/api/categories').then(r => r.json()).catch(() => []),
    fetch('/api/cities').then(r => r.json()).catch(() => [])
  ]);
  fillSelect('propertyType', types, 'name');
  fillSelect('category', cats, 'name');
  fillSelect('city', cities, 'name');
}

function fillSelect(id, data, labelKey) {
  const sel = document.getElementById(id);
  data.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item[labelKey];
    sel.appendChild(opt);
  });
}

async function loadDistricts(cityId) {
  const sel = document.getElementById('district');
  const neighborhoodSel = document.getElementById('neighborhood');
  sel.innerHTML = '<option value="">Yükleniyor...</option>';
  if (neighborhoodSel) neighborhoodSel.innerHTML = '<option value="">Önce ilçe seçin</option>';
  if (!cityId) { sel.innerHTML = '<option value="">Önce şehir seçin</option>'; return; }
  const data = await fetch('/api/districts/by-city/' + cityId).then(r => r.json()).catch(() => []);
  sel.innerHTML = '<option value="">Seçiniz...</option>';
  data.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item.name;
    sel.appendChild(opt);
  });
}

async function loadNeighborhoods(districtId) {
  const sel = document.getElementById('neighborhood');
  if (!sel) return;
  sel.innerHTML = '<option value="">Yükleniyor...</option>';
  if (!districtId) { sel.innerHTML = '<option value="">Önce ilçe seçin</option>'; return; }
  const data = await fetch('/api/neighborhoods/district/' + districtId).then(r => r.json()).catch(() => []);
  sel.innerHTML = '<option value="">Seçiniz...</option>';
  data.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item.name;
    sel.appendChild(opt);
  });
}

loadSelects();

function formatFloorName(value) {
  const floorNumber = Number(value);
  return floorNumber === 0 ? 'Giriş Kat' : floorNumber + '. Kat';
}

function isValidFloorValue(value) {
  const floorNumber = Number(value);
  return value !== '' && Number.isInteger(floorNumber) && floorNumber >= -2;
}

// Resim önizleme
let selectedFiles = [];

function handleFiles(files) {
  for (const f of files) {
    if (f.size > 10 * 1024 * 1024) { showToast('Dosya 10 MB sınırını aşıyor: ' + f.name, 'error'); continue; }
    selectedFiles.push(f);
  }
  renderPreviews();
}

function renderPreviews() {
  const grid = document.getElementById('previewGrid');
  grid.innerHTML = '';
  selectedFiles.forEach((f, i) => {
    const url = URL.createObjectURL(f);
    grid.innerHTML += `
      <div class="preview-item">
        <img src="${url}" alt="önizleme">
        <button class="remove" onclick="removeFile(${i})">✕</button>
      </div>`;
  });
}

function removeFile(i) {
  selectedFiles.splice(i, 1);
  renderPreviews();
}

// Drag & drop
const zone = document.getElementById('uploadZone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});

// Submit
async function submitIlan() {
  const title       = document.getElementById('title').value.trim();
  const price       = document.getElementById('price').value;
  const typeId      = document.getElementById('propertyType').value;
  const catId       = document.getElementById('category').value;
  const cityId      = document.getElementById('city').value;
  const districtId  = document.getElementById('district').value;
  const neighborhoodId = document.getElementById('neighborhood').value;
  const floorValue  = document.getElementById('floor').value;
  const description = document.getElementById('description').value.trim();

  if (!title)  { showToast('İlan başlığı zorunludur.', 'error'); return; }
  if (!price)  { showToast('Fiyat zorunludur.', 'error'); return; }
  if (!typeId) { showToast('İlan tipi seçiniz.', 'error'); return; }
  if (!catId)  { showToast('Kategori seçiniz.', 'error'); return; }
  if (!cityId) { showToast('Şehir seçiniz.', 'error'); return; }
  if (!isValidFloorValue(floorValue)) { showToast('Kat alanı zorunludur. -2, -1, 0 veya pozitif tam sayı giriniz.', 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Yayınlanıyor...';

  try {
    const body = {
      title, description, price: parseFloat(price),
      propertyType: typeId ? { id: parseInt(typeId) } : null,
      category:     catId  ? { id: parseInt(catId) }  : null,
      city:         cityId ? { id: parseInt(cityId) }  : null,
      district:     districtId ? { id: parseInt(districtId) } : null,
      neighborhood: neighborhoodId ? { id: parseInt(neighborhoodId) } : null,
      floor:        { name: formatFloorName(floorValue) },
      user:         user?.id ? { id: parseInt(user.id) } : null
    };

    const res = await fetch('/api/properties', {
      method: 'POST', headers,
      body: JSON.stringify(body)
    });

    if (!res.ok) { throw new Error(await res.text()); }

    const property = await res.json();

    // Resim yükleme
    if (selectedFiles.length > 0) {
      const fd = new FormData();
      selectedFiles.forEach(f => fd.append('images', f));
      const imageRes = await fetch(`/api/properties/${property.id}/images`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: fd
      });
      if (!imageRes.ok) {
        throw new Error('Ilan olustu ancak fotograflar kaydedilemedi: ' + await imageRes.text());
      }
    }

    showToast('İlan başarıyla yayınlandı!', 'success');
    setTimeout(() => { window.location.href = 'hesabim.html'; }, 1800);
  } catch (err) {
    showToast('Hata: ' + (err.message || 'Bilinmeyen hata'), 'error');
    btn.disabled = false;
    btn.textContent = 'İlanı Yayınla';
  }
}

let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
