<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmlakPrime | Şifre Yenile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#0B1F3A;
  --accent:#C9A84C;
  --accent-light:#E8C97A;
  --white:#ffffff;
  --gray-100:#EFF1F5;
  --gray-400:#9AA3B2;
  --gray-600:#5A6478;
  --text:#111827;
  --danger:#c0392b;
  --success:#27ae60;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:30px 16px;
  font-family:'DM Sans',sans-serif;
  color:var(--text);
  background:var(--navy);
  position:relative;
  overflow-x:hidden;
}

.bg-iframe{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  border:none;z-index:0;
  pointer-events:none;
  filter:blur(3px) brightness(0.55);
  transform:scale(1.06);
}

.bg-overlay{
  position:fixed;inset:0;
  background:rgba(11,31,58,0.55);
  backdrop-filter:blur(2px);
  z-index:1;
}

.close-btn{
  position:fixed;top:1.5rem;right:1.5rem;
  z-index:300;
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(12px);
  border:1.5px solid rgba(255,255,255,0.25);
  display:flex;align-items:center;justify-content:center;
  color:var(--white);font-size:1.25rem;
  text-decoration:none;
  transition:all .25s ease;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}

.close-btn:hover{
  background:rgba(255,255,255,0.28);
  transform:scale(1.08) rotate(90deg);
  border-color:rgba(201,168,76,0.6);
  color:var(--accent-light);
}

.page-title{
  font-family:'Playfair Display',serif;
  text-align:center;
  margin:0 0 24px;
  color:var(--white);
  font-size:22px;
  font-weight:700;
  letter-spacing:0.2px;
  position:relative;
  z-index:10;
}

.page-title span{color:var(--accent)}

.reset-panel{
  position:relative;
  z-index:10;
  width:min(430px,100%);
  min-height:420px;
  background:rgba(255,255,255,0.96);
  border-radius:22px;
  box-shadow:0 24px 80px rgba(0,0,0,0.35);
  padding:44px 38px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:30px;
  color:var(--navy);
  margin-bottom:8px;
  text-align:center;
}

p{
  color:var(--gray-600);
  font-size:14px;
  line-height:1.5;
  text-align:center;
  margin-bottom:24px;
}

.input-group{
  position:relative;
  width:100%;
  margin:10px 0;
}

.input-group i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--gray-400);
}

input{
  width:100%;
  border:none;
  background:#f5f7fb;
  border-radius:12px;
  padding:14px 14px 14px 42px;
  font-size:14px;
  color:var(--text);
  outline:none;
  border:1px solid transparent;
}

input:focus{
  border-color:rgba(201,168,76,0.7);
  box-shadow:0 0 0 4px rgba(201,168,76,0.13);
  background:#fff;
}

button{
  width:100%;
  margin-top:16px;
  border-radius:999px;
  border:1px solid var(--accent);
  background:linear-gradient(135deg,var(--accent-light),var(--accent));
  color:#07101f;
  font-size:12px;
  font-family:'DM Sans',sans-serif;
  font-weight:800;
  padding:13px 30px;
  letter-spacing:1px;
  text-transform:uppercase;
  transition:transform 80ms ease-in,box-shadow 0.25s ease,filter 0.25s ease;
  cursor:pointer;
  box-shadow:0 12px 24px rgba(201,168,76,0.28);
}

button:hover{filter:brightness(1.06);box-shadow:0 16px 34px rgba(201,168,76,0.38)}
button:active{transform:scale(0.98)}
button:disabled{opacity:.65;cursor:not-allowed}

.message{
  min-height:20px;
  margin-top:14px;
  text-align:center;
  font-size:13px;
  line-height:1.4;
}

.message.error{color:var(--danger)}
.message.success{color:var(--success)}

@media(max-width:480px){
  body{padding:0 14px}
  .page-title{display:none}
  .reset-panel{border-radius:18px;padding:36px 22px}
  h1{font-size:24px}
}
</style>
</head>
<body>
<iframe src="index.html" class="bg-iframe" tabindex="-1" aria-hidden="true"></iframe>
<div class="bg-overlay"></div>
<a href="login.html" class="close-btn" title="Giriş Sayfasına Dön"><i class="fa-solid fa-xmark"></i></a>

<div class="page-title">Emlak<span>Prime</span> &nbsp;|&nbsp; Gayrimenkul Platformu</div>

<main class="reset-panel">
  <h1>Şifre Yenile</h1>
  <p>Yeni şifrenizi belirleyin ve hesabınızla girişe devam edin.</p>

  <div class="input-group">
    <i class="fa-solid fa-lock"></i>
    <input type="password" id="newPassword" placeholder="Yeni şifre" autocomplete="new-password">
  </div>

  <div class="input-group">
    <i class="fa-solid fa-lock"></i>
    <input type="password" id="confirmPassword" placeholder="Yeni şifre tekrar" autocomplete="new-password">
  </div>

  <button id="resetButton" onclick="submitReset()">Şifreyi Yenile</button>
  <div class="message" id="message"></div>
</main>

<script>
const API_BASE_URL = "http://localhost:8080/api";
const token = new URLSearchParams(window.location.search).get("token");
const message = document.getElementById("message");
const resetButton = document.getElementById("resetButton");

function showMessage(text, type) {
  message.textContent = text;
  message.className = `message ${type || ""}`.trim();
}

if (!token) {
  showMessage("Şifre sıfırlama bağlantısı geçersiz.", "error");
  resetButton.disabled = true;
}

async function submitReset() {
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!token) {
    showMessage("Şifre sıfırlama bağlantısı geçersiz.", "error");
    return;
  }
  if (!newPassword.trim()) {
    showMessage("Şifre boş olamaz.", "error");
    return;
  }
  if (newPassword !== confirmPassword) {
    showMessage("Şifreler eşleşmiyor.", "error");
    return;
  }

  resetButton.disabled = true;
  resetButton.textContent = "Güncelleniyor...";
  showMessage("", "");

  try {
    const res = await fetch(`${API_BASE_URL}/users/password-reset`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword })
    });

    const text = await res.text();
    if (!res.ok) {
      showMessage(text || "Şifre sıfırlama bağlantısı süresi dolmuş.", "error");
      return;
    }

    showMessage(text || "Şifre başarıyla güncellendi.", "success");
    setTimeout(() => {
      window.location.href = "login.html";
    }, 1600);
  } catch (err) {
    showMessage("Sunucuya bağlanılamadı.", "error");
  } finally {
    resetButton.disabled = false;
    resetButton.textContent = "Şifreyi Yenile";
  }
}
</script>
</body>
</html>
